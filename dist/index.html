<body><h1>Welcome! to the Drawing Generator</h1><fieldset><legend>Select shape you want to generate:</legend><div><input type="radio" id="dog" name="animal" value="dog" checked /><label for="dog">Dog</label></div><div><input type="radio" id="cat" name="animal" value="cat" /><label for="cat">Cat</label></div><div><input type="radio" id="duck" name="animal" value="duck" /><label for="duck">Duck</label></div></fieldset><button class="audio-controller">Click me!</button><style>body{background-color:dimgray;color:white;font-family:sans-serif}button{padding:6px 14px;border-radius:4px;background-color:darkred;color:white;margin-top:23px}</style><script>const e=new AudioContext;document.querySelector(".audio-controller").addEventListener("click",()=>{const t=e.createOscillator();t.frequency.value=340,t.connect(e.destination),t.start();const n=document.querySelector("input[name='animal']:checked");new Promise((e,t)=>{setTimeout(()=>{e()},200)}).then(()=>{t.stop()}),console.log("value:",n?.value)});</script></body>
