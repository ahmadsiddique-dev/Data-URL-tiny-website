<body><h1>Welcome! to the Drawing Generator</h1><audio src="../public/button-click.mp3"></audio><fieldset><legend>Select shape you want to generate:</legend><div><input type="radio" id="dog" name="animal" value="dog" checked/><label for="dog">Dog</label></div><div><input type="radio" id="cat" name="animal" value="cat" /><label for="cat">Cat</label></div><div><input type="radio" id="duck" name="animal" value="duck" /><label for="duck">Duck</label></div></fieldset><button class="audio-controller">Click me!</button><style>body{background-color:dimgray;color:white;font-family:sans-serif}button{padding:6px 14px;border-radius:4px;background-color:darkred;color:white;margin-top:23px}</style><script>const e=document.querySelector("audio");document.querySelector(".audio-controller").addEventListener("click",()=>{e.play();const o=document.querySelector("input[name='animal']:checked");console.log("value:",o?.value)});</script></body>
